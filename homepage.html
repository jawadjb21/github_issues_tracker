<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <!-- Scripts -->
    <script src="./scripts/homepage.js" defer></script>

    <!-- Style -->
    <link rel="stylesheet" href="./styles/homepage.css">
    <!-- Icon -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="geist mx-4">
    <header class="sticky top-0 z-50">
        <nav>
            <div class="navbar bg-base-100 shadow-sm">
                <div class="navbar-start">
                    <div class="dropdown">
                        <div tabindex="0" role="button" class="btn btn-ghost">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h8m-8 6h16" />
                            </svg>
                        </div>
                        <ul tabindex="-1"
                            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                            <li id="btn_all_nav"><a>All Issues</a></li>
                            <li id="btn_open_nav"><a>Open Issues</a></li>
                            <li id="btn_closed_nav"><a>Closed Issues</a></li>
                        </ul>
                    </div>
                    <div class="flex gap-.05 justify-center items-center">
                        <img src="./assets/github-logo.png" alt="Logo of GitHub" class="h-8">
                        <a class="btn btn-ghost font-bold text-xl">GitHub Issues Tracker</a>
                    </div>
                </div>
                <div class="navbar-end">
                    <div class="join">
                        <div>
                            <label class="input validator join-item">
                                <input class="text-secondary" type="text" placeholder="Search Issues..." required />
                            </label>
                            <div class="validator-hint hidden">Enter valid email address</div>
                        </div>
                        <button id="search_btn" class="btn btn-neutral join-item"><i
                                class="fa-solid fa-magnifying-glass text-secondary"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="mt-15 mx-8 flex flex-col gap-4">
        <section id="tabs_display" class="border border-gray-300 p-6 flex justify-start items-center gap-3">
            <button id="btn_all" class="btn btn-outline btn-neutral border-[#64748B] text-secondary active">All</button>
            <button id="btn_open" class="btn btn-outline btn-neutral border-[#64748B] text-secondary">Open</button>
            <button id="btn_closed" class="btn btn-outline btn-neutral border-[#64748B] text-secondary">Closed</button>
        </section>

        <section id="current_tab" class="border border-gray-300">
            <div id="details" class="flex justify-between items-center p-6">
                <div id="details_left" class="flex gap-2 justify-center items-center">
                    <img src="./assets/Aperture.png" alt="" class="h-8">
                    <div>
                        <h4 class="font-bold text-xl text-black"><span id="issue_count">50</span> Issues</h4>
                        <p class="text-secondary">Track and manage your project issues</p>
                    </div>
                </div>
                <div id="details_right">
                    <ul class="list-disc flex gap-8 justify-center items-center">
                        <li class="font-semibold marker:text-green-600 marker:text-xl">Open</li>
                        <li class="font-semibold marker:text-purple-600 marker:text-xl">Closed</li>
                    </ul>
                </div>
            </div>
            <hr class="text-secondary">
            <div id="issue_container" class="grid grid-cols-2 lg:grid-cols-4 gap-3 bg-gray-100 p-3">
                <section id="spinner" class="flex justify-center items-center py-10 hidden">
                    <span class="loading loading-infinity loading-xl"></span>
                </section>
            </div>
        </section>

        <dialog id="word_modal" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box">
                <div id="details_container"></div>
                <div class="modal-action">
                    <form method="dialog">
                        <!-- if there is a button in form, it will close the modal -->
                        <button class="btn btn-neutral">Close</button>
                    </form>
                </div>
            </div>
        </dialog>
    </main>
</body>

</html>
